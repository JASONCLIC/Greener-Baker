<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chart Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #chart {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chart Test</h1>
        <button id="refreshBtn">Refresh Data</button>
        <div id="chart"></div>
    </div>

    <!-- 引入echarts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        // 确保页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM已加载完成");
            
            // 初始化图表
            var chartDom = document.getElementById('chart');
            var myChart = echarts.init(chartDom);
            
            // 模拟数据
            var mockData = [
                {
                    material: 'Flour',
                    unit: 'kg',
                    predictions: [15, 18, 12]
                },
                {
                    material: 'Sugar',
                    unit: 'kg',
                    predictions: [8, 10, 7]
                },
                {
                    material: 'Butter',
                    unit: 'kg',
                    predictions: [5, 6, 4]
                },
                {
                    material: 'Eggs',
                    unit: 'pcs',
                    predictions: [20, 25, 18]
                }
            ];
            
            // 提取材料名称
            var materialNames = mockData.map(function(item) {
                return item.material;
            });
            
            // 准备系列数据
            var seriesData = mockData.map(function(item) {
                return {
                    name: item.material,
                    type: 'bar',
                    data: item.predictions
                };
            });
            
            // 设置图表选项
            var option = {
                title: {
                    text: 'Next 3 Days Ingredient Demand Prediction',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                legend: {
                    data: materialNames,
                    top: 30
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: ['Day 1', 'Day 2', 'Day 3']
                },
                yAxis: {
                    type: 'value',
                    name: 'Demand'
                },
                series: seriesData
            };
            
            // 设置图表
            myChart.setOption(option);
            
            // 处理刷新按钮点击
            document.getElementById('refreshBtn').addEventListener('click', function() {
                // 模拟刷新数据（随机变化）
                mockData.forEach(function(item) {
                    item.predictions = item.predictions.map(function() {
                        return Math.floor(Math.random() * 30) + 5;
                    });
                });
                
                // 更新系列数据
                seriesData = mockData.map(function(item) {
                    return {
                        name: item.material,
                        type: 'bar',
                        data: item.predictions
                    };
                });
                
                // 更新图表
                myChart.setOption({
                    series: seriesData
                });
            });
        });
    </script>
</body>
</html>
